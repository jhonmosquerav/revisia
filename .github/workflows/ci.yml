name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint · format · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          python-version: "3.13"

      # Pango para WeasyPrint (extra `pdf`): así la prueba real del
      # `URLFetcher(allowed_protocols={"data"})` del exportador corre en CI en
      # vez de saltarse (seguimiento de la Ola 0).
      - name: System libs for WeasyPrint
        run: sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0

      - name: Sync (dev + pdf extras)
        run: uv sync --extra dev --extra pdf

      # Falla aquí si WeasyPrint no carga: sin este paso, `importorskip` saltaría
      # la prueba en silencio y el CI seguiría en verde sin verificar nada.
      - name: WeasyPrint importable
        run: uv run python -c "import weasyprint; print('weasyprint', weasyprint.__version__)"

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Tests (pytest, offline)
        run: uv run pytest -q -rs
